name: WordPress-Plugin veröffentlichen
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin-Version, z. B. 0.7.10'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP-Paket erstellen und Version prüfen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -f twitch-musik-client/twitch-musik-client.php
          grep -Fq "Version: ${VERSION}" twitch-musik-client/twitch-musik-client.php
          if find twitch-musik-client -type f -name '*.bak' | grep -q .; then
            echo 'Backup-Dateien im Plugin-Verzeichnis gefunden' >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli
          php -l twitch-musik-client/twitch-musik-client.php
          mkdir -p dist
          zip -r -q "dist/twitch-musik-client-v${VERSION}.zip" twitch-musik-client \
            -x '*/.DS_Store' '*/.git/*' '*/.env*' '*/.bak' '*.sql'
          unzip -t "dist/twitch-musik-client-v${VERSION}.zip"
          sha256sum "dist/twitch-musik-client-v${VERSION}.zip"
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Musikwunschbox v${{ inputs.version }}
          generate_release_notes: true
          files: dist/twitch-musik-client-v${{ inputs.version }}.zip
